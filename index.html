<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đua ngựa – I want to be …</title>
<style>
:root{color-scheme:dark;--bg:#14213d;--chalk:#fdf6e3;--board:#1f5e45;--gold:#ffc233;--ink:#14213d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--chalk);font-family:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;touch-action:none}
#wrap{position:relative;width:min(98vw,calc(80vh*16/9));aspect-ratio:16/9;border-radius:16px;overflow:hidden;box-shadow:0 0 0 4px var(--gold)}
canvas#c{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,20,40,.55)}
#ov.off{display:none}
.card{background:var(--chalk);color:var(--ink);border-radius:18px;padding:14px 18px;width:70%;max-height:94%;overflow:auto;text-align:center;box-sizing:border-box}
.card.wide{width:90%;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.card h2{margin:0 0 4px;font-size:clamp(18px,3.2vw,26px)}.card h3{margin:6px 0 2px;font-size:17px;color:var(--board)}
.card p{margin:4px 0;font-size:clamp(13px,1.8vw,16px);line-height:1.4}
.big{font-size:clamp(20px,3.4vw,32px);font-weight:800;color:var(--board);margin:6px 0}
.mine{font-size:clamp(30px,5vw,46px);letter-spacing:6px}
.opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.opt,.go{font:inherit;cursor:pointer;border:3px solid #cfd8c8;background:#fff;border-radius:14px;padding:6px 14px;color:var(--ink)}
.opt{font-size:clamp(30px,4.6vw,44px);min-width:84px}.opt.txt{font-size:clamp(15px,2.2vw,21px);font-weight:700}
.opt.ok{border-color:#2a9d4a;background:#d9f5e1}.opt.no{border-color:#d62839;background:#fde0e3}
.go{background:var(--gold);border-color:var(--gold);font-size:clamp(16px,2.4vw,22px);font-weight:800;margin:8px 4px 0;padding:8px 22px}
.go.alt{background:#fff;border-color:#cfd8c8}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;padding:5px 0;text-align:left;border-bottom:1px solid #e3e0d0}
.mini{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:10px;padding:6px 10px;background:var(--gold);color:var(--ink);cursor:pointer;min-width:92px}
.mini:disabled{background:#d8d8d0;color:#777;cursor:default}
.sw{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-3px;border:2px solid #14213d}
.sw2{width:34px;height:34px;border-radius:50%;border:3px solid #14213d55;cursor:pointer;margin:4px}.sw2.on{border-color:#1f5e45;box-shadow:0 0 0 3px #ffc233}
#nm{font:inherit;font-size:18px;padding:6px 10px;border-radius:10px;border:3px solid #cfd8c8;width:80%;text-align:center;color:var(--ink);background:#fff}
#pv{background:#cfeaff;border-radius:12px;max-width:100%}
.rank div{font-size:20px;font-weight:700;padding:2px 0}.rank .me{color:#d62839;font-size:24px}
#fb{min-height:26px;font-size:clamp(14px,2vw,20px);font-weight:800;margin-top:8px}
#pad{display:flex;gap:12px}
#pad button{font-size:24px;min-width:110px;height:48px;border-radius:14px;border:0;background:var(--gold);color:var(--ink);cursor:pointer;font-weight:800}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas><div id="ov"></div></div>
<div id="pad"><button id="bU">▲ Lên</button><button id="bJ">⤴ Nhảy</button><button id="bD">▼ Xuống</button></div>
<script>
const W=960,H=540,PX=230,L=34,SPAN=900,LY=300,LG=90,cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov');
cv.width=W;cv.height=H;
const jobs=[{w:'teacher',e:'🧑‍🏫'},{w:'painter',e:'🖌️'},{w:'singer',e:'🧑‍🎤'},{w:'scientist',e:'🧑‍🔬'}];
const whyBank=[['English','teacher'],['painting','painter'],['music','singer'],['science','scientist']];
const sents=['Why do you like music?','I like it because I want to be a singer.','Why do you like science?','I like it because I want to be a scientist.','Why do you like English?','I like it because I want to be a teacher.','Why do you like painting?','I like it because I want to be a painter.'];
const coats=[{id:'#8b5a2b',n:'Nâu',c:0,mane:'#2b1a0e'},{id:'#2b2b2b',n:'Đen',c:20,mane:'#8a8a8a'},{id:'#f4f1ea',n:'Trắng',c:30,mane:'#9aa3b5'},{id:'#d9a441',n:'Vàng kim',c:50,mane:'#6b3f10'},{id:'#f4a6c0',n:'Hồng',c:80,mane:'#9b3d63'}];
const ups=[{id:'eng',n:'🔧 Chân khỏe hơn (chạy nhanh hơn)',max:2,cost:l=>35*(l+1)},{id:'nit',n:'⚡ Turbo kéo dài 6 giây',max:1,cost:()=>40},{id:'mag',n:'🧲 Nam châm hút xu làn bên cạnh',max:1,cost:()=>40}];
const FONT="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',system-ui,sans-serif";
let S={w:0,coats:['#8b5a2b'],coat:'#8b5a2b',name:'Sao Mai',eng:0,nit:0,mag:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('cs_b8')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('cs_b8',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let st='menu',lane=1,px=1,jt=9,coins=0,P=0,objs=[],rivals=[],t=0,ph=0,spawnT=1,qT=7,inv=0,stunT=0,nitT=0,boostT=0,mudT=0,padT=0,last=0,tt=0;
const rnd=n=>Math.floor(Math.random()*n),shuf=a=>a.slice().sort(()=>Math.random()-.5);
const ly=l=>LY+LG*l,sc=l=>.78+.14*l,coatOf=id=>coats.find(c=>c.id==id)||coats[0];
const rank=()=>1+rivals.filter(r=>r.R>P).length;
function show(h){ov.innerHTML=h;ov.className=''}function hide(){ov.className='off'}
function horse(c,x,y,s,coat,mane,silk,p,fire){const u=s*100;c.save();c.translate(x,y);c.lineCap='round';
 if(fire){c.fillStyle='rgba(255,150,0,.85)';c.beginPath();c.moveTo(-u*.7,-u*.7);c.lineTo(-u*1.6,-u*.5);c.lineTo(-u*.7,-u*.3);c.fill()}
 [-.45,-.3,.3,.45].forEach((hx,i)=>{const a=Math.sin(p+i*1.7)*.75,fx=u*hx+Math.sin(a)*u*.45,fy=-u*.42+Math.abs(Math.cos(a))*u*.42-Math.max(0,Math.cos(p+i*1.7))*u*.08;
  c.strokeStyle=coat;c.lineWidth=u*.1;c.beginPath();c.moveTo(u*hx,-u*.45);c.lineTo(fx,fy);c.stroke();c.fillStyle='#222';c.beginPath();c.arc(fx,fy,u*.055,0,7);c.fill()});
 c.strokeStyle=mane;c.lineWidth=u*.13;c.beginPath();c.moveTo(-u*.5,-u*.72);c.quadraticCurveTo(-u*.85,-u*.7+Math.sin(p)*u*.1,-u*.82,-u*.3);c.stroke();
 c.fillStyle=coat;c.beginPath();c.ellipse(0,-u*.62,u*.55,u*.27,0,0,7);c.fill();
 c.beginPath();c.moveTo(u*.35,-u*.78);c.lineTo(u*.62,-u*1.18);c.lineTo(u*.82,-u*1.06);c.lineTo(u*.55,-u*.52);c.fill();
 c.beginPath();c.ellipse(u*.84,-u*1.06,u*.23,u*.12,.55,0,7);c.fill();c.beginPath();c.moveTo(u*.68,-u*1.2);c.lineTo(u*.72,-u*1.38);c.lineTo(u*.8,-u*1.2);c.fill();
 c.fillStyle='#14161c';c.beginPath();c.arc(u*.85,-u*1.12,u*.03,0,7);c.fill();
 c.strokeStyle=mane;c.lineWidth=u*.12;c.beginPath();c.moveTo(u*.4,-u*.84);c.lineTo(u*.64,-u*1.2);c.stroke();
 c.fillStyle=silk;c.fillRect(-u*.18,-u*.92,u*.34,u*.14);c.beginPath();c.ellipse(-u*.02,-u*1.12,u*.13,u*.2,.2,0,7);c.fill();
 c.fillStyle='#f1c27d';c.beginPath();c.arc(u*.05,-u*1.4,u*.1,0,7);c.fill();c.fillStyle=silk;c.beginPath();c.arc(u*.05,-u*1.43,u*.105,Math.PI,0);c.fill();c.restore()}
function menu(){st='menu';const cur=coatOf(S.coat);
 show(`<div class="card wide"><div><h2>🐎 Đua ngựa – I want to be …</h2><canvas id="pv" width="240" height="150"></canvas><div id="sws">${coats.filter(c=>S.coats.includes(c.id)).map(c=>`<button class="sw2${S.coat==c.id?' on':''}" data-c="${c.id}" style="background:${c.id}" title="${c.n}"></button>`).join('')}</div><input id="nm" maxlength="12" placeholder="Đặt tên cho ngựa" value="${esc(S.name)}"></div>
 <div><h3>Cách chơi</h3><p>Về đích đầu tiên! Ba con ngựa đối thủ chạy nhanh và cũng biết dùng Turbo.</p><p>🎁 Nhặt hộp quà và trả lời đúng để bật Turbo ⚡. 🪙 Nhặt xu, 🥕 cà rốt giúp chạy nhanh một chút.</p><p>🚧 Hàng rào: bấm <b>Nhảy</b> hoặc đổi làn. 🟤 Vũng bùn làm chậm. 🚀 Ô tăng tốc màu cam giúp chạy rất nhanh, đừng nhảy qua nhé!</p><p>Phím ↑ ↓ đổi làn, Space để nhảy.</p><p class="big">Ví: 🪙 ${S.w}</p><button class="go" id="s">Xuất phát</button><button class="go alt" id="sh">🛒 Cửa hàng</button></div></div>`);
 const pvd=()=>{const c=document.getElementById('pv').getContext('2d'),k=coatOf(S.coat);c.clearRect(0,0,240,150);c.fillStyle='#b98a55';c.fillRect(0,128,240,22);horse(c,120,128,.95,k.id,k.mane,'#e63946',.6,false)};pvd();
 ov.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.coat=b.dataset.c;save();ov.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));pvd()});
 document.getElementById('s').onclick=start;document.getElementById('sh').onclick=()=>{const n=document.getElementById('nm');if(n){S.name=n.value.trim()||'Sao Mai';save()}shop()}}
function start(){const n=document.getElementById('nm');if(n){S.name=n.value.trim()||'Sao Mai';save()}
 coins=0;P=0;objs=[];t=0;spawnT=1.2;qT=7;inv=0;stunT=0;nitT=0;boostT=0;mudT=0;padT=0;jt=9;lane=1;px=1;
 rivals=[{name:'Thunder',R:.5,v:.44,coat:'#b9783a',mane:'#3b2314',silk:'#ff7b00',lane:0,x:0,ct:2,nt:0,nc:3},{name:'Storm',R:.3,v:.465,coat:'#8d99ae',mane:'#2b2d42',silk:'#06b6a4',lane:2,x:2,ct:3,nt:0,nc:5},{name:'Blaze',R:.15,v:.49,coat:'#e9c46a',mane:'#7a4a12',silk:'#9b5de5',lane:1,x:1,ct:1,nt:0,nc:7}];hide();st='play'}
function finish(){st='over';const r=1+rivals.filter(x=>x.R>=L).length,bonus=[30,20,10,5][r-1],md=['🥇','🥈','🥉','4️⃣'];S.w+=coins+bonus;save();
 const rs=[...rivals].sort((a,b)=>b.R-a.R).map(x=>x.name);rs.splice(r-1,0,S.name);
 show(`<div class="card"><h2>🏁 Về đích!</h2><div class="rank">${rs.map((n,i)=>`<div class="${i==r-1?'me':''}">${md[i]} ${esc(n)}</div>`).join('')}</div><p>Hạng ${r}/4 · Xu nhặt được: ${coins} · Thưởng hạng: ${bonus} · Ví: ${S.w} xu</p><button class="go" id="s">Đua lại</button><button class="go alt" id="sh">🛒 Cửa hàng</button><button class="go alt" id="mn">Đổi ngựa</button></div>`);
 document.getElementById('s').onclick=start;document.getElementById('sh').onclick=shop;document.getElementById('mn').onclick=menu}
function shop(){st='shop';let h=`<div class="card"><h2>🛒 Cửa hàng</h2><p class="big">🪙 ${S.w}</p><h3>Màu ngựa</h3>`;
 coats.forEach(x=>{const own=S.coats.includes(x.id),on=S.coat==x.id;h+=`<div class="row"><span><i class="sw" style="background:${x.id}"></i> ${x.n}</span><button class="mini" data-h="${x.id}" ${on||(!own&&S.w<x.c)?'disabled':''}>${on?'Đang dùng':own?'Dùng':x.c+' 🪙'}</button></div>`});
 h+=`<h3>Nâng cấp</h3>`;
 ups.forEach(u=>{const l=S[u.id],full=l>=u.max,c=u.cost(l);h+=`<div class="row"><span>${u.n}${u.max>1?` (${l}/${u.max})`:''}</span><button class="mini" data-u="${u.id}" ${full||S.w<c?'disabled':''}>${full?'Đã đủ':c+' 🪙'}</button></div>`});
 h+=`<button class="go" id="bk">Quay lại</button></div>`;show(h);
 ov.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const id=b.dataset.h,x=coats.find(k=>k.id==id);if(S.coats.includes(id))S.coat=id;else if(S.w>=x.c){S.w-=x.c;S.coats.push(id);S.coat=id}save();shop()});
 ov.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const u=ups.find(k=>k.id==b.dataset.u),c=u.cost(S[u.id]);if(S[u.id]<u.max&&S.w>=c){S.w-=c;S[u.id]++;save()}shop()});
 document.getElementById('bk').onclick=menu}
const bg=h=>`<div class="big" style="font-size:clamp(16px,2.6vw,26px)">${h}</div>`;
function mkPic(){const k=rnd(2),it=jobs[rnd(4)],three=shuf([it,...shuf(jobs.filter(x=>x!==it)).slice(0,2)]);
 if(k==0)return{t:'👀 Nhìn hình và chọn từ đúng',p:`<div class="mine">${it.e}</div>`,txt:1,o:three.map(x=>({h:x.w,ok:x===it}))};
 return{t:'📖 Đọc và chọn hình đúng',p:`<div class="big">${it.w}</div>`,o:three.map(x=>({h:x.e,ok:x===it}))}}
function mkWhy(){const [sub,job]=whyBank[rnd(4)],o=shuf([job,...shuf(jobs.map(x=>x.w).filter(x=>x!=job)).slice(0,2)]);
 return{t:'💬 Chọn đáp án đúng',p:`${bg('Why do you like '+sub+'?')}<p>I like it because I want to be a ___.</p>`,txt:1,o:o.map(x=>({h:x,ok:x==job}))}}
function mkBecause(){const it=jobs[rnd(4)];return{t:'🌟 Chọn từ điền vào chỗ trống',p:`<div class="mine">${it.e}</div>${bg('I like it because I want to be a ___.')}`,txt:1,o:shuf([it,...shuf(jobs.filter(x=>x!==it)).slice(0,2)]).map(x=>({h:x.w,ok:x===it}))}}
function mkYesNo(){const yn=[{h:'Yes',ok:0},{h:'No',ok:0}],same=Math.random()<.5;let p,why='';
 if(Math.random()<.5){const it=jobs[rnd(4)],sh=same?it:shuf(jobs.filter(x=>x!==it))[0];p=`<div class="mine">${it.e}</div>${bg('I want to be a '+sh.w+'.')}`;if(!same)why='Hình này là “'+it.w+'”.'}
 else{const [sub,job]=whyBank[rnd(4)],sh=same?job:shuf(whyBank.map(x=>x[1]).filter(x=>x!=job))[0];p=`${bg('Why do you like '+sub+'?')}<p>I like it because I want to be a ${sh}.</p>`;if(!same)why='Đúng là: a '+job+'.'}
 yn[0].ok=same;yn[1].ok=!same;return{t:'👍 Câu này đúng không? Yes hay No?',p,txt:1,why,o:yn}}
function mkQ(){const r=rnd(10);if(r<2)return mkPic();if(r<4)return mkWhy();if(r<6)return mkBecause();if(r<8)return mkYesNo();
 return{t:'🔤 Sắp xếp thành câu',p:'<p>Chạm vào các từ theo đúng thứ tự.</p>',sort:sents[rnd(sents.length)]}}
function ask(){st='q';const q=mkQ();let done=0;
 show(`<div class="card"><h2>${q.t}</h2>${q.p}<div class="opts" id="line"></div><div class="opts" id="os"></div><div id="fb"></div></div>`);
 const os=document.getElementById('os'),fb=document.getElementById('fb'),line=document.getElementById('line');
 const fin=ok=>{done=1;if(ok){nitT=S.nit?6:4;fb.textContent='⚡ Turbo! Phi nước đại nào!'}else{stunT=1.5;fb.textContent='😵 Ngựa bị chậm lại!'}
  if(q.why)fb.textContent+=' '+q.why;setTimeout(()=>{objs=objs.filter(x=>x.d<.55);hide();st='play';inv=1},q.why?2600:1100)};
 const mk=(txt,cls,fn)=>{const b=document.createElement('button');b.className=cls;b.textContent=txt;b.onclick=fn;return b};
 if(q.sort){const ws=q.sort.split(' '),pool=shuf(ws.map((w,i)=>({w,i})));let pick=[];
  const rs=()=>{line.innerHTML='';os.innerHTML='';pick.forEach(c=>line.append(mk(c.w,'opt txt ok',()=>{if(!done){pick=pick.filter(x=>x!==c);rs()}})));
   pool.filter(c=>!pick.includes(c)).forEach(c=>os.append(mk(c.w,'opt txt',()=>{if(done)return;pick.push(c);rs();if(pick.length==ws.length){const ok=pick.map(x=>x.w).join(' ')==q.sort;if(!ok)q.why='Đáp án: '+q.sort;fin(ok)}})))};
  rs();return}
 q.o.forEach(o=>{const b=mk(o.h,'opt'+(q.txt?' txt':''),()=>{if(done)return;
  if(o.ok)b.classList.add('ok');else{b.classList.add('no');[...os.children].forEach((c,i)=>{if(q.o[i].ok)c.classList.add('ok')})}
  fin(o.ok)});os.appendChild(b)})}
function spawn(){if(qT<=0){const l=rnd(3);for(let i=1;i<4;i++)objs.push({d:-(i-1)*.07,lane:l,k:'c'});objs.push({d:-.21,lane:l,k:'g'});qT=7;return}
 const l=rnd(3),r=Math.random();if(r<.26)objs.push({d:0,lane:l,k:'b'});else if(r<.38)objs.push({d:0,lane:l,k:'m'});else if(r<.44)objs.push({d:0,lane:l,k:'k'});else if(r<.54)objs.push({d:0,lane:l,k:'p'});else for(let i=0;i<3;i++)objs.push({d:-i*.07,lane:l,k:'c'})}
function upd(dt){t+=dt;qT-=dt;spawnT-=dt;inv-=dt;stunT-=dt;nitT-=dt;boostT-=dt;mudT-=dt;padT-=dt;jt+=dt;
 let v=.4+.03*S.eng+(nitT>0?.22:0)+(boostT>0?.15:0)+(padT>0?.22:0);if(stunT>0)v*=.5;if(mudT>0)v*=.7;
 P+=v*dt;ph+=v*dt*30;
 if(spawnT<=0&&L-P>1.3){spawn();spawnT=1.1+Math.random()*.5}
 px+=(lane-px)*Math.min(1,dt*12);
 const air=jt>.12&&jt<.63;
 for(const r of rivals){r.nc-=dt;r.nt-=dt;if(r.nc<=0&&r.nt<=0){r.nt=2.5;r.nc=7+Math.random()*4}const gap=P-r.R;r.R+=(r.v+.02*Math.sin(t*.7+r.lane)+(r.nt>0?.18:0)+(gap>0?Math.min(.06,gap*.1):0))*dt;r.ct-=dt;if(r.ct<=0){r.lane=rnd(3);r.ct=2+Math.random()*2}r.x+=(r.lane-r.x)*Math.min(1,dt*3);
  if(Math.abs(r.R-P)<.08&&Math.abs(px-r.x)<.6&&inv<=0&&!air){stunT=1.2;inv=1.5}}
 for(const o of objs){o.d+=v*dt;
  if(o.d>.92&&o.d<1.06&&!o.x){const dx=Math.abs(px-o.lane);
   if(o.k=='c'&&dx<(S.mag?1.55:.55)){o.x=1;coins++}
   else if(o.k=='k'&&dx<.6){o.x=1;boostT=1.2}
   else if(o.k=='g'&&dx<.6){o.x=1;ask();return}
   else if(o.k=='b'&&dx<.55&&!air){o.x=1;if(inv<=0){stunT=1.5;inv=1.5}}
   else if(o.k=='m'&&dx<.55&&!air){o.x=1;mudT=1}
   else if(o.k=='p'&&dx<.6&&!air){o.x=1;padT=1.3}}}
 objs=objs.filter(o=>o.d<1.1&&!o.x);
 if(P>=L)finish()}
function txt(s,x,y,sz,al='center',c='#fff'){g.font=`800 ${sz}px ${FONT}`;g.textAlign=al;g.textBaseline='middle';g.lineJoin='round';g.lineWidth=5;g.strokeStyle='rgba(0,0,0,.5)';g.strokeText(s,x,y);g.fillStyle=c;g.fillText(s,x,y)}
const md=(a,m)=>((a%m)+m)%m;
function stand(o){
 const wl=g.createLinearGradient(0,110,0,250);wl.addColorStop(0,'#46557a');wl.addColorStop(1,'#2f3a58');g.fillStyle=wl;g.fillRect(0,110,W,140);
 g.fillStyle='#ffc233';g.fillRect(0,110,W,22);const sx=md(-o*.3,300);for(let k=-1;k<5;k++)txt('GO! GO! GO!',sx+k*300+150,121,17,'center','#c1121f');
 const fc=['#e63946','#3a86ff','#2ecc71','#ffc233','#9b5de5'];for(let i=0;i<40;i++){const x=md(i*26-o*.3,W+52)-26,sw=Math.sin(tt*5+i)*3;g.fillStyle=fc[i%5];g.beginPath();g.moveTo(x-9,132);g.lineTo(x+9,132);g.lineTo(x+sw,148);g.fill()}
 const cs=['#e63946','#ffc233','#3a86ff','#2ecc71','#9b5de5','#ff7b00','#f4f4f4'],sk=['#f1c27d','#e0ac69','#c68642','#8d5524'],tier=['#3c486b','#35405f','#2d3753'];
 for(let r=0;r<3;r++){const by=178+r*24;g.fillStyle=tier[r];g.fillRect(0,by-2,W,36);
  for(let i=0;i<40;i++){const x=md(i*26+r*13-o*(.3+r*.05),W+60)-30,bob=Math.max(0,Math.sin(tt*9+i*1.3+r)*5),y=by-bob,a=Math.sin(tt*9+i)*.6,c=sk[(i+r)%4];
   g.fillStyle=cs[(i*7+r*3)%7];g.fillRect(x-8,y-14,16,26);g.fillStyle=c;g.beginPath();g.arc(x,y-22,8,0,7);g.fill();
   g.strokeStyle=c;g.lineWidth=4;g.lineCap='round';g.beginPath();g.moveTo(x-8,y-8);g.lineTo(x-15-a*5,y-31);g.moveTo(x+8,y-8);g.lineTo(x+15+a*5,y-31);g.stroke()}}}
function confetti(){if(!(st=='play'&&(nitT>0||padT>0||rank()==1)))return;const cs=['#e63946','#ffc233','#3a86ff','#2ecc71','#ff7b00'];for(let i=0;i<36;i++){g.fillStyle=cs[i%5];g.fillRect(md(i*53+tt*(20+i%5*8),W),md(i*29+tt*70,250),7,4)}}
function scene(){const o=P*SPAN;
 const sk=g.createLinearGradient(0,0,0,250);sk.addColorStop(0,'#6fb7ee');sk.addColorStop(1,'#e8f6ff');g.fillStyle=sk;g.fillRect(0,0,W,250);
 g.fillStyle='#fff6c8';g.beginPath();g.arc(830,70,38,0,7);g.fill();
 g.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<4;i++){const x=md(i*320-o*.05,1400)-200,y=60+(i%2)*50;g.beginPath();g.arc(x,y,24,0,7);g.arc(x+28,y-8,30,0,7);g.arc(x+58,y,22,0,7);g.fill()}
 stand(o);
 g.fillStyle='#c98f58';g.fillRect(0,250,W,H-250);
 const s1=md(-o,160);g.fillStyle='rgba(0,0,0,.05)';for(let k=-1;k<7;k++)g.fillRect(s1+k*160-160,250,80,H-250);
 const s2=md(-o,80);g.fillStyle='rgba(255,255,255,.5)';for(const yy of[345,435])for(let k=-1;k<13;k++)g.fillRect(s2+k*80,yy-2,40,4);
 g.fillStyle='#f4f4f4';g.fillRect(0,242,W,6);g.fillRect(0,226,W,5);const s3=md(-o,120);for(let k=-1;k<9;k++)g.fillRect(s3+k*120,222,9,28);
 g.fillStyle='#4c9a5a';g.fillRect(0,H-10,W,10);confetti()}
function draw(){scene();
 const fx=PX+(L-P)*SPAN;if(fx>-40&&fx<W+40){for(let r=0;r<14;r++)for(let c=0;c<2;c++){g.fillStyle=(r+c)%2?'#f4f4f4':'#14161c';g.fillRect(fx+c*14,250+r*20,14,20)}}
 const cm=coatOf(S.coat).mane,list=[{l:px,x:PX,k:'me'},...rivals.map((r,i)=>({l:r.x,x:PX+(r.R-P)*SPAN,k:'r',r,i})),...objs.filter(o=>o.d>=0).map(o=>({l:o.lane,x:PX+(1-o.d)*SPAN,k:o.k,o}))].sort((a,b)=>a.l-b.l);
 for(const e of list){if(e.x<-130||e.x>W+130)continue;const y=ly(e.l),s=sc(e.l);
  if(e.k=='c'){g.fillStyle='#ffc233';g.beginPath();g.arc(e.x,y-30*s,11*s,0,7);g.fill();g.strokeStyle='#b8860b';g.lineWidth=2;g.stroke()}
  else if(e.k=='p'){const pu=.5+.5*Math.sin(tt*8);g.fillStyle=`rgba(255,159,28,${.2+.25*pu})`;g.beginPath();g.ellipse(e.x,y-8*s,76*s,24*s,0,0,7);g.fill();g.fillStyle='#ff9f1c';g.fillRect(e.x-58*s,y-20*s,116*s,24*s);g.fillStyle='#fff';for(let k=-1;k<=1;k++){const cx=e.x+k*34*s;g.beginPath();g.moveTo(cx-10*s,y-18*s);g.lineTo(cx+8*s,y-8*s);g.lineTo(cx-10*s,y+2*s);g.lineTo(cx-2*s,y-8*s);g.fill()}}
  else if(e.k=='k')txt('🥕',e.x,y-26*s,44*s);
  else if(e.k=='m'){g.fillStyle='#6b4423';g.beginPath();g.ellipse(e.x,y-6*s,52*s,15*s,0,0,7);g.fill();g.fillStyle='#8a5a30';g.beginPath();g.ellipse(e.x-8*s,y-9*s,30*s,8*s,0,0,7);g.fill()}
  else if(e.k=='b'){g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(e.x,y,44*s,9*s,0,0,7);g.fill();g.fillStyle='#f4f4f4';g.fillRect(e.x-40*s,y-52*s,8*s,52*s);g.fillRect(e.x+32*s,y-52*s,8*s,52*s);g.fillStyle='#d62839';g.fillRect(e.x-40*s,y-46*s,80*s,10*s);g.fillStyle='#f4f4f4';g.fillRect(e.x-40*s,y-28*s,80*s,10*s)}
  else if(e.k=='g'){const by=y-56*s-6*Math.sin(t*4);g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(e.x,y,26*s,7*s,0,0,7);g.fill();const gl=g.createRadialGradient(e.x,by,2,e.x,by,48*s);gl.addColorStop(0,'rgba(255,230,120,.85)');gl.addColorStop(1,'rgba(255,230,120,0)');g.fillStyle=gl;g.beginPath();g.arc(e.x,by,48*s,0,7);g.fill();txt('🎁',e.x,by,56*s)}
  else if(e.k=='r'){g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(e.x,y,60*s,10*s,0,0,7);g.fill();horse(g,e.x,y,s,e.r.coat,e.r.mane,e.r.silk,ph+e.i*2,e.r.nt>0);txt(e.r.name,e.x,y-150*s,15*s+4,'center','#fff')}
  else{const air=jt<.75?Math.sin(Math.PI*jt/.75)*95*s:0;g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(PX,y,60*s,10*s,0,0,7);g.fill();
   if(inv<=0||Math.floor(inv*10)%2){horse(g,PX,y-air,s,S.coat,cm,'#e63946',ph,nitT>0||boostT>0||padT>0);txt('▼ '+S.name,PX+10,y-air-160*s,17*s+4,'center','#ffe066')}}}
 txt('🪙 '+coins,20,36,30,'left','#ffc233');txt('🏁 Hạng '+rank()+'/4',W-20,36,28,'right');
 g.fillStyle='rgba(0,0,0,.5)';g.fillRect(250,26,460,12);const bx=r=>250+460*Math.min(1,r/L);
 for(const r of rivals){g.fillStyle=r.silk;g.beginPath();g.arc(bx(r.R),32,6,0,7);g.fill()}
 g.fillStyle='#e63946';g.beginPath();g.arc(bx(P),32,8,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();txt('🏁',724,32,22,'left');
 if(st=='play'){if(nitT>0)txt('⚡ TURBO!',W/2,80,34,'center','#ffb703');else if(stunT>0)txt('💥 Chậm lại!',W/2,80,32,'center','#ff6b6b');else if(mudT>0)txt('🟤 Sa lầy!',W/2,80,30,'center','#e0b080');else if(padT>0)txt('🚀 Ô tăng tốc!',W/2,80,32,'center','#ffd166');else if(boostT>0)txt('🥕 Tăng lực!',W/2,80,30,'center','#ffa94d');
  const rv=rivals.find(r=>r.nt>0);if(rv)txt('💨 '+rv.name+' dùng Turbo!',W/2,114,22,'center','#ffd6a5')}}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;tt=ts/1000;if(st=='play')upd(dt);draw();requestAnimationFrame(loop)}
const go=d=>{if(st=='play')lane=Math.max(0,Math.min(2,lane+d))},jump=()=>{if(st=='play'&&jt>=.9)jt=0};
document.getElementById('bU').onclick=()=>go(-1);document.getElementById('bD').onclick=()=>go(1);document.getElementById('bJ').onclick=jump;
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowUp'||e.key=='w')go(-1);if(e.key=='ArrowDown'||e.key=='s')go(1);if(e.key==' '||e.key=='Spacebar'){e.preventDefault();jump()}});
let sx=0,sy=0;cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});cv.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dy)>25&&Math.abs(dy)>Math.abs(dx))go(dy>0?1:-1);else if(Math.abs(dx)<15&&Math.abs(dy)<15)jump()});
menu();requestAnimationFrame(loop);
